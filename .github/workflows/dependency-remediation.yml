name: Temporary Dependency Remediation

on:
  push:
    branches:
      - feature/rtr360-production-hardening

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rtr360-production-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Repair audited dependencies
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dependency-remediation.yml
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required"
            exit 0
          fi
          git commit -m "security(deps): remediate audited dependency"
          git push origin HEAD:feature/rtr360-production-hardening
