# Optional Datadog Synthetic monitoring.
# Disabled from automatic CI until Datadog credentials and tagged tests are
# provisioned. Keep this workflow available for an explicit manual run.

name: Run Datadog Synthetic tests

on:
  workflow_dispatch:
    inputs:
      test_search_query:
        description: "Datadog Synthetic test search query"
        required: false
        default: "tag:e2e-tests"

jobs:
  build:
    if: ${{ secrets.DD_API_KEY != '' && secrets.DD_APP_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Datadog Synthetic tests
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: ${{ inputs.test_search_query }}

  not-configured:
    if: ${{ secrets.DD_API_KEY == '' || secrets.DD_APP_KEY == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain synthetic monitoring status
        run: echo "Datadog Synthetic tests unavailable because DD_API_KEY and/or DD_APP_KEY are not configured."
